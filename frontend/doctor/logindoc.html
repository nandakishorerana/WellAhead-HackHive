  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WellAhead — Doctor Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="logindoc.css">
  </head>

  <body>

  <div class="outer-wrapper d-flex justify-content-center align-items-center">

    <div class="main-container">
      <div class="row g-0 h-100">

        <!-- LEFT -->
        <div class="col-md-6 left-panel d-flex flex-column justify-content-center text-center">
          <h2 class="logo">
            <img src="logo.png" alt="" class="logo-img" width="44" height="44">
            <span class="logo-text">WellAhead</span>
          </h2>

          <p class="left-sub">Enhancing patient care through intelligent medical insights.</p>

          <div class="image-box">
            <img src="imagejobhi.jpeg" alt="Healthcare illustration" class="img-fluid">
          </div>
        </div>

        <!-- RIGHT -->
        <div class="col-md-6 right-panel d-flex justify-content-center align-items-center">
          <div class="signup-box">

            <h3 class="title text-center">Doctor Login</h3>

            <div class="input-box">
              <i class="fa fa-envelope"></i>
              <input type="email" id="email" placeholder="Email" autocomplete="email">
            </div>

            <div class="input-box">
              <i class="fa fa-lock"></i>
              <input type="password" id="password" placeholder="Password" autocomplete="current-password">
              <i class="fa fa-eye eye" data-target="password" aria-label="Show password"></i>
            </div>

            <button type="button" class="login-btn" id="loginBtn">Login</button>

            <p class="Signup-text">
              <a href="#">Forgot Password?</a>
            </p>

            <div class="or-divider">
              <span>OR</span>
            </div>

            <a class="login-outline" href="Signup-doctor.html">Sign Up as Doctor</a>

          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="logindoc.js"></script>
  </body>
  </html>
