<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WellAhead | Doctor Appointments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- YOUR ORIGINAL CSS -->
    <link rel="stylesheet" href="Doctors-dashboard.css">
</head>

<body>

<div class="main-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
       <div class="brand">
      <img class="brand-logo" src="logo.png" width="44" height="44" alt="WellAhead">
      <span class="brand-name">WellAhead</span>
    </div>

        <ul>
            <li><a href="Doctors-dashboard.html">Dashboard</a></li>
            <li><a href="doctor-patient.html">Patients</a></li>
            <li class="active"><a href="doctor-appointment.html">Appointments</a></li>
            <li><a href="doctor-message.html">Messages</a></li>
        </ul>

        <div class="sidebar-profile">
            <div class="profile-section" id="profileTrigger">
                <button class="profile-btn">👤</button>
                <div class="dropdown-menu" id="profileMenu">
                    <div>Settings</div>
                    <div>Logout</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- CONTENT -->
    <div class="content">

        <!-- HEADER -->
        <div class="header d-flex justify-content-between align-items-center">
            <div>
                <h5 class="page-title mb-0">Doctor Appointments</h5>
                <span class="header-sub">
                    Manage schedules, high-risk patients, and appointment flow
                </span>
            </div>
        </div>

        <!-- STATS -->
        <div class="row mt-3 g-3">

            <div class="col-md-4">
                <div class="card-box lift-card">
                    <div class="metric-icon">📅</div>
                    <p>Total Appointments</p>
                    <h4 id="totalCount">0</h4>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box lift-card">
                    <div class="metric-icon">⏰</div>
                    <p>Today's Appointments</p>
                    <h4 id="todayCount">0</h4>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box lift-card">
                    <div class="metric-icon">⚠</div>
                    <p>Pending Requests</p>
                    <h4 id="pendingCount">0</h4>
                </div>
            </div>

        </div>

        <!-- APPOINTMENT TABLE -->
        <div class="row mt-4">
            <div class="col-md-12">

                <div class="table-box">

                    <h6>Appointments</h6>

                    <div class="table-responsive">

                        <table class="table align-middle mb-0">

                            <thead>
                                <tr>
                                    <th>Patient</th>
                                    <th>Time</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody id="scheduleTable">
                                <!-- DATA COMES FROM JS -->
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>
        </div>

    </div>

</div>

<!-- ✅ CORRECT SCRIPT -->
<script src="doctor-appointment.js"></script>

</body>
</html>
