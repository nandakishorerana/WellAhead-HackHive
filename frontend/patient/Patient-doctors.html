<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WellAhead | Doctors</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="Patient-doctors.css">
</head>

<body>

<div class="page-shell">

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <img class="brand-logo" src="logo.png" width="44" height="44" alt="WellAhead">
            <span class="brand-name">WellAhead</span>
        </div>

        <ul class="sidebar-nav">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="patient-insight.html">AI Insights</a></li>
            <li><a href="patient-prevent.html">Prevention Plan</a></li>
            <li class="active"><a href="Patient-doctors.html">Doctors</a></li>
            <li><a href="patient-history.html">Health History</a></li>
        </ul>

        <div class="profile-section" id="profileTrigger">
            <img src="https://i.pravatar.cc/40?img=12">
            <span>Sam Carter</span>
        </div>
    </aside>

    <main class="main-content">

        <header class="top-header">
            <button class="menu-btn d-lg-none" id="menuBtn">☰</button>
            <h1>Doctors</h1>
        </header>

        <section class="hero-lite">
            <h4>Recommended Doctors for You</h4>
            <p>AI-curated specialists based on your health profile.</p>
        </section>

        <section class="content-section">

            <div class="search-row">
                <input id="doctorSearch" type="text" placeholder="Search doctors or specialization">
            </div>

            <div class="filters" id="filters">
                <button class="active" data-filter="all">All</button>
                <button data-filter="cardiologist">Cardiologist</button>
                <button data-filter="general physician">General Physician</button>
                <button data-filter="diabetologist">Diabetologist</button>
            </div>

            <div class="row g-4">
                <div class="col-xl-8" id="doctorContainer"></div>

                <div class="col-xl-4">
                    <aside class="appointment-card">
                        <h6>Your Upcoming Appointment</h6>
                        <p class="doc-name">--</p>
                        <p class="time">--</p>
                        <button class="btn-outline-teal w-100">Start Chat</button>
                        <button class="btn-solid-teal w-100 mt-2">Start Call</button>
                    </aside>
                </div>
            </div>

        </section>

    </main>
</div>

<!-- 🔥 SLOT MODAL -->
<div class="modal fade" id="bookingModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Select Appointment Slot</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="date" id="appointmentDate" class="form-control mb-3">
        <div id="slotContainer" class="d-flex flex-wrap gap-2"></div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="confirmBooking">Confirm</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="Patient-doctors.js"></script>

</body>
</html>
<script>
  // ✅ prevent past date
  const dateInput = document.getElementById("appointmentDate");
  if (dateInput) {
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;
  }
</script>
