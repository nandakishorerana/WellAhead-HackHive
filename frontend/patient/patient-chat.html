<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Doctor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #f1f5f9;
  font-family: 'Inter', sans-serif;
}

/* Container */
.chat-container {
  max-width: 800px;
  margin: 30px auto;
  background: white;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  height: 80vh;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* Header */
.chat-header {
  padding: 15px;
  border-bottom: 1px solid #eee;
  font-weight: 600;
}

/* Chat area */
.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

/* Message */
.message {
  max-width: 70%;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 12px;
  position: relative;
  font-size: 14px;
}

/* Left (doctor) */
.message.left {
  background: #e5e7eb;
  align-self: flex-start;
}

/* Right (patient) */
.message.right {
  background: #0ea5e9;
  color: white;
  align-self: flex-end;
}

/* Time */
.message span {
  display: block;
  font-size: 10px;
  margin-top: 5px;
  opacity: 0.7;
}

/* Input area */
.chat-input {
  display: flex;
  border-top: 1px solid #eee;
  padding: 10px;
  gap: 10px;
}

.chat-input input {
  flex: 1;
  border-radius: 8px;
  border: 1px solid #ccc;
  padding: 10px;
}

.chat-input button {
  background: #0ea5e9;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
}
</style>

</head>

<body>

<div class="chat-container">

  <div class="chat-header">
    💬 Chat with Doctor
  </div>

  <div id="chatBox" class="chat-box"></div>

  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Type message...">
    <button id="chatSendBtn">Send</button>
  </div>

</div>

<script src="patient-chat.js"></script>

</body>
</html>
